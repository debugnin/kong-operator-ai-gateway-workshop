# Links the DataPlane (below) to the Konnect control plane created above.
# Client certificate provisioning is left on "Automatic" so Kong Operator
# generates and manages the mTLS cert/secret used to connect the DataPlane
# to Konnect.
apiVersion: konnect.konghq.com/v1alpha2
kind: KonnectExtension
metadata:
  name: ai-gateway-konnect-extension
  namespace: kong-ai-gateway
spec:
  konnect:
    controlPlane:
      ref:
        type: konnectNamespacedRef
        konnectNamespacedRef:
          name: ai-gateway-control-plane
  clientAuth:
    certificateSecret:
      provisioning: Automatic
