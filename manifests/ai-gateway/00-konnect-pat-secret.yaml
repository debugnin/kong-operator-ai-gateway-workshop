# Placeholder Secret holding the Konnect Personal Access Token (PAT).
#
# DO NOT commit a real token. Before applying/syncing this via ArgoCD, create
# the real secret out-of-band, e.g.:
#
#   kubectl create secret generic konnect-pat \
#     --namespace kong-ai-gateway \
#     --from-literal=token="$KONNECT_TOKEN"
#   kubectl label secret konnect-pat -n kong-ai-gateway konghq.com/secret=true
#
# Kong Operator only watches Secrets labeled "konghq.com/secret: true" by
# default -- see docs/02-connect-konnect.md.
#
# This manifest is included as documentation/reference only; see
# docs/02-connect-konnect.md for how to create the real Secret and keep it out
# of ArgoCD's sync (e.g. with a sealed-secret / external-secret in a real
# deployment, or kubectl apply manually before the ArgoCD app syncs).
apiVersion: v1
kind: Secret
metadata:
  name: konnect-pat
  namespace: kong-ai-gateway
  labels:
    konghq.com/secret: "true"
type: Opaque
stringData:
  token: "REPLACE_WITH_KONNECT_PAT"
