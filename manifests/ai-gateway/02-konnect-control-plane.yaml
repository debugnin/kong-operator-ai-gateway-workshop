# Creates a Konnect AI Gateway control plane (NOT a regular Gateway control
# plane -- KonnectGatewayControlPlane would create the wrong Konnect entity
# type for this workshop). KonnectAIGateway is the Kong Operator resource
# that provisions an AI Gateway-typed control plane in Konnect and serves as
# the parent for the AIGatewayDataPlane, AIGatewayModelProvider and
# AIGatewayModel resources.
#
# See: https://developer.konghq.com/operator/get-started/ai-gateway/deploy/
apiVersion: konnect.konghq.com/v1alpha1
kind: KonnectAIGateway
metadata:
  name: ai-gateway-control-plane
  namespace: kong-ai-gateway
spec:
  apiSpec:
    name: ai-gateway-control-plane
    displayName: Kong AI Gateway Workshop
    description: "AI Gateway control plane for the Kong AI Gateway workshop"
  konnect:
    authRef:
      name: konnect-api-auth
