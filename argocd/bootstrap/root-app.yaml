# "App of Apps" root Application.
#
# Apply this once ArgoCD is installed and it will create/sync every Application
# manifest found under argocd/apps/ in this repo (the Kong Operator CRDs app,
# the Kong Operator app, and the AI Gateway DataPlane/Konnect app).
#
# >>> Replace REPO_URL below with the URL of the git fork/repo you push this
#     workshop content to, and TARGET_REVISION with the branch you're using. <<<
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kong-ai-gateway-workshop
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: REPO_URL
    targetRevision: TARGET_REVISION
    path: argocd/apps
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
