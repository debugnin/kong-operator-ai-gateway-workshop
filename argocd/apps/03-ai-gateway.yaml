# Deploys the Kong AI Gateway DataPlane and its Konnect control-plane wiring
# (KonnectAPIAuthConfiguration, KonnectAIGateway, AIGatewayDataPlane) into
# the kong-ai-gateway namespace. KonnectAIGateway creates an AI Gateway-typed
# control plane in Konnect (distinct from a regular KonnectGatewayControlPlane),
# and AIGatewayDataPlane runs the AI Gateway binary directly against it with
# automatic mTLS -- no separate KonnectExtension is needed for this path.
#
# Runs after the CRDs (-2) and the operator (-1) are up and ready.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kong-ai-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: REPO_URL
    targetRevision: TARGET_REVISION
    path: manifests/ai-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: kong-ai-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
